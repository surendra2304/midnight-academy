name: CI & Production Health Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    name: Typecheck, Lint & Full Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite
        run: npm run test

      - name: Run Production SSR & Client Build
        run: npm run build
        env:
          SUPABASE_URL: https://mock-toefl-project.supabase.co
          SUPABASE_SECRET_KEY: mock-service-role-key-for-ci-and-testing
          VITE_SUPABASE_URL: https://mock-toefl-project.supabase.co
          VITE_SUPABASE_ANON_KEY: mock-anon-key-for-ci-and-testing
